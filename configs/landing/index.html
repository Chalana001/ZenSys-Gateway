<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZenSys</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fbfbfd;
      color: #1c1c1e;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
    p { color: #6b6b70; margin: 0; font-size: 0.95rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #101012; color: #f2f2f5; }
      p { color: #9a9aa2; }
    }
  </style>
</head>

  <main>
    <h1>ZenSys</h1>
