# ZenSys Gateway — local development configuration.
#
# Contains no secrets. The three secrets (registry DSN, POS service token,
# GMS service token) are supplied through environment variables named below.
#
#   export ZENSYS_REGISTRY_DSN='root:secret@tcp(127.0.0.1:3306)/zensys_gateway?parseTime=true'
#   export ZENSYS_TOKEN_POS="$(openssl rand -hex 32)"
#   export ZENSYS_TOKEN_GMS="$(openssl rand -hex 32)"
#
# See configs/gateway.example.yaml for the annotated production reference.

server:
  public_addr: "127.0.0.1:8080"
  internal_addr: "127.0.0.1:8081"
  read_header_timeout: 5s
  idle_timeout: 60s
  shutdown_grace: 15s
  max_header_bytes: 65536
  max_body_bytes: 10485760

platform:
  root_domain: "zensys.lk"
  apex_behavior: "landing"
  landing_dir: "./configs/landing"

registry:
  driver: "mysql"
  dsn_env: "ZENSYS_REGISTRY_DSN"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 5m
  query_timeout: 2s

cache:
  route_ttl: 60s
  negative_ttl: 30s
  max_entries: 10000

products:
  POS:
    frontend_upstream: "http://127.0.0.1:3001"
    backend_upstream: "http://127.0.0.1:8082"
    upstream_timeout: 30s
    inject_tenant_header: true
    tenant_header_name: "X-Tenant-ID"

  GMS:
    frontend_upstream: "http://127.0.0.1:3002"
    backend_upstream: "http://127.0.0.1:8083"
    upstream_timeout: 30s
    inject_tenant_header: true
    tenant_header_name: "X-Tenant-ID"

routing:
  backend_path_prefix: "/api"
  path_prefix_case_sensitive: true

proxy:
  preserve_host: true
  request_id_header: "X-Request-ID"
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
  upstream_response_header_timeout: 30s

internal_auth:
  mode: "token"
  tokens:
    - service: "pos"
      token_env: "ZENSYS_TOKEN_POS"
      may_manage_products: ["POS"]
    - service: "gms"
      token_env: "ZENSYS_TOKEN_GMS"
      may_manage_products: ["GMS"]

rate_limit:
  enabled: true
  ip:
    rps: 200
    burst: 400
  tenant:
    rps: 50
    burst: 100

observability:
  log_level: "debug"
  log_format: "text"
  metrics_enabled: true
  health_on_public: false
